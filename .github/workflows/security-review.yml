name: 월간 보안 점검

on:
  schedule:
    - cron: "0 0 1 * *"   # 매월 1일 오전 9시 (한국 시간)
  workflow_dispatch:       # Actions 탭에서 직접 실행도 가능

permissions:
  contents: read
  issues: write

jobs:
  checklist:
    runs-on: ubuntu-latest
    steps:
      - name: 점검 이슈 만들기
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = "보안 점검";
            const month = new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 7);

            // 라벨이 없으면 만들기
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: "0f766e", description: "월간 보안 점검" });
            } catch (e) { if (e.status !== 422) throw e; }

            // 지난달 점검 이슈가 열려 있으면 닫기
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: "open", labels: label });
            for (const issue of open) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "not_planned" });
            }

            // 자동 점검: 지난 31일 동안 이 저장소에 커밋한 계정
            const since = new Date(Date.now() - 31 * 86400e3).toISOString();
            const commits = await github.paginate(github.rest.repos.listCommits, { owner, repo, since, per_page: 100 });
            const authors = {};
            for (const c of commits) {
              const name = c.author?.login || c.commit.author?.name || "알 수 없음";
              authors[name] = (authors[name] || 0) + 1;
            }
            const known = new Set([owner, "github-actions[bot]"]);
            const others = Object.keys(authors).filter((a) => !known.has(a));
            const authorLines = Object.entries(authors)
              .sort((a, b) => b[1] - a[1])
              .map(([a, n]) => `- ${known.has(a) ? "" : "⚠️ "}\`${a}\` 커밋 ${n}개`)
              .join("\n") || "- 지난 한 달 동안 커밋이 없었어요.";

            const r = `https://github.com/${owner}/${repo}`;
            const body = [
              `${month} 정기 점검입니다. 항목을 확인하고 체크한 뒤 이슈를 닫아주세요.`,
              "",
              "## 자동 확인 결과",
              "",
              "지난 31일 동안 이 저장소에 커밋한 계정입니다.",
              "",
              authorLines,
              "",
              others.length
                ? `> ⚠️ 표시된 계정은 본인이나 배포 봇이 아닙니다. 아는 계정인지 확인하세요.`
                : "> 본인과 배포 봇 외의 커밋은 없었어요.",
              "",
              "## 계정 점검",
              "",
              "- [ ] [설치한 GitHub 앱](https://github.com/settings/installations): Pages CMS, giscus 외에 모르는 앱이 없는지, 안 쓰는 앱은 제거",
              "- [ ] [승인한 OAuth 앱](https://github.com/settings/applications): 안 쓰는 앱은 Revoke",
              "- [ ] [개인 액세스 토큰](https://github.com/settings/personal-access-tokens): 안 쓰거나 만료 기한이 없는 토큰 정리",
              "- [ ] [SSH 키](https://github.com/settings/keys): 모르는 키나 안 쓰는 기기의 키 삭제",
              "- [ ] [보안 기록](https://github.com/settings/security-log): 낯선 로그인이나 설정 변경이 없는지",
              "- [ ] [2단계 인증](https://github.com/settings/security): 켜져 있는지",
              "",
              "## 저장소 점검",
              "",
              `- [ ] [협업자](${r}/settings/access): 모르는 사람이 없는지`,
              `- [ ] [배포 키](${r}/settings/keys), [웹훅](${r}/settings/hooks): 직접 만들지 않은 항목이 없는지`,
              `- [ ] [비밀 정보 알림](${r}/security/secret-scanning): 새 알림이 없는지`,
              `- [ ] [Pages 설정](${r}/settings/pages): 도메인과 HTTPS 설정이 그대로인지`,
              "",
              "_이 이슈는 `.github/workflows/security-review.yml`이 매월 1일에 만듭니다._",
            ].join("\n");

            const issue = await github.rest.issues.create({
              owner, repo, title: `월간 보안 점검 (${month})`, body, labels: [label], assignees: [owner],
            });
            core.info(`이슈를 만들었어요: ${issue.data.html_url}`);
