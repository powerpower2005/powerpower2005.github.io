<header class="site-header">
  <div class="header-inner container">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="{{ t.main_nav }}">
      {% include nav-links.html class="nav-link" %}
      <a class="icon-link" href="{{ t.search_url | relative_url }}" aria-label="{{ t.search }}"{% if page.url == t.search_url %} aria-current="page"{% endif %}>
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-linecap="round" stroke-width="2"/></svg>
        <kbd class="kbd">⌘K</kbd>
      </a>
      <button class="theme-toggle" type="button" aria-label="{{ t.theme_toggle }}">
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
      </button>
      <button class="menu-btn" type="button" aria-label="{{ t.menu }}" aria-controls="drawer" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </div>
</header>
